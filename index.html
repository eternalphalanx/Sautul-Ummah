<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mvIZzj D¤§vn</title>

<style>

/* ===== BODY BACKGROUND (UNCHANGED) ===== */
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;

background:linear-gradient(
180deg,
#8E92C8 0%,
#9DB1E8 50%,
#9FD7D5 100%
);
}

/* ===== MAIN 3D CARD ===== */
.container{
width:360px;
padding:25px;
border-radius:25px;

background:rgba(255,255,255,0.12);
backdrop-filter:blur(15px);

box-shadow:
0 25px 50px rgba(0,0,0,0.25),
inset 0 1px 1px rgba(255,255,255,0.2);

transform:perspective(1000px) rotateX(5deg) rotateY(-5deg);
transition:0.4s;
}

.container:hover{
transform:perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1.02);
}

/* ===== LOGO / TITLE ===== */
.logo{
text-align:center;
margin-bottom:15px;
}

.logo h1{
margin:0;
font-size:28px;
font-weight:700;

background:linear-gradient(135deg,#ffffff,#dbeafe);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

text-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.logo p{
margin-top:6px;
font-size:13px;
color:#f1f5f9;
}

/* ===== 3D BOX ===== */
.card{
padding:18px;
border-radius:18px;

background:rgba(255,255,255,0.25);

box-shadow:
inset 0 2px 5px rgba(255,255,255,0.5),
0 10px 25px rgba(0,0,0,0.2);
}

/* ===== BUTTON ===== */
.btn{
margin-top:15px;
width:100%;
padding:12px;
border:none;
border-radius:14px;

font-weight:600;
color:white;
cursor:pointer;

background:linear-gradient(135deg,#5B6BEF,#4A5CE0);

box-shadow:
0 10px 20px rgba(75,85,200,0.4),
inset 0 1px 2px rgba(255,255,255,0.4);

transition:0.3s;
}

.btn:hover{
transform:translateY(-2px);
box-shadow:
0 15px 25px rgba(75,85,200,0.5);
}

/* ===== INFO TEXT ===== */
.info{
margin-top:12px;
font-size:13px;
text-align:center;
color:#e5e7eb;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
<h1>Sautul Ummah</h1>
<p>Voice of Unity • Strength • Truth</p>
</div>

<div class="card">
<p style="text-align:center; font-size:14px; color:#1f2937;">
Empowering the Ummah with knowledge, unity, and strength.
Stay connected and be part of something meaningful.
</p>

<button class="btn">Join Now</button>
</div>

<div class="info">
A platform for growth, awareness, and unity.
</div>

</div>

</body>
</html>
